hooks:
  before_implement:
  - command: usm.task-protocol
    description: 'Inject the mandatory per-task checkoff protocol (Constitution: Logical
      Atomicity Protocol — Immediate Checkpointing & Progress Tracking). Each task
      MUST be checked off in tasks.md immediately after it is completed and verified;
      batch checkoff is forbidden.

      '
    optional: false
installed:
- bug
settings:
  auto_execute_hooks: true
